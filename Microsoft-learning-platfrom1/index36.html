<!DOCTYPE html>
<html>

<head>
    <title>Microsoft Learning Hub</title>

    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <!-- NAVIGATION -->

    <nav>

        <h2>Microsoft Learning Hub</h2>

        <a href="javascript:goHome()" on click="goHome() return false;">Home</a>
        <a href="#">Learning Paths</a>
        <a href="#">My Progress</a>

    </nav>


    <!-- HOME PAGE -->

    <main>

        <div id="home">

            <h1>Welcome to Microsoft Learning Hub</h1>

            <p>
                Track your Microsoft Learn journey
                and discover what to learn next.
            </p>

            <button id="getStarted"
             onclick="startLearning()">
                Get Started
            </button>

        </div>


        <!-- DOMAIN SELECTION -->

        <div id="domains" style="display: none;">

            <h2>Choose Your Domain</h2>

            <p>What do you want to learn?</p>

            <button onclick="chooseDomain('Cloud')">
                Cloud
            </button>

            <button onclick="chooseDomain('AI/Data')">
                AI / Data
            </button>

            <button onclick="chooseDomain('Security')">
                Security
            </button>

        </div>


        <!-- LEARNING PATH -->

        <div id="path" style="display: none;">

            <h2 id="pathTitle"></h2>

            <div id="certifications"></div>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        // GET STARTED

        function startLearning() {

            document.getElementById("home").style.display = "none";

            document.getElementById("domains").style.display = "block";

        }


        // CHOOSE DOMAIN

        function chooseDomain(domain) {

            document.getElementById("domains").style.display = "none";

            document.getElementById("path").style.display = "block";

            document.getElementById("pathTitle").innerText =
                domain + " Learning Path";


            if (domain === "Cloud") {

                showCloudPath();

            }

            else if (domain === "AI/Data") {

                showAIPath();

            }

            else if (domain === "Security") {

                showSecurityPath();

            }

        }


        // CLOUD PATH

        function showCloudPath() {

            document.getElementById("certifications").innerHTML = `

                <div class="certificate">

                    <h3>AZ-900 — Azure Fundamentals</h3>

                    <p>Level: Beginner</p>

                    <p id="az900Status">
                        🔵 Available
                    </p>

                    <button id="az900Button" 
                     onclick="completeAZ900()">
                        Mark as Completed
                    </button>

                </div>


                <div class="certificate">

                    <h3>AZ-104 — Azure Administrator</h3>

                    <p>Level: Intermediate</p>

                    <p id="az104Status">
                        🔒 Locked
                    </p>

                </div>


                <div class="certificate">

                    <h3>AZ-305 — Azure Solutions Architect</h3>

                    <p>Level: Advanced</p>

                    <p id="az305Status">
                        🔒 Locked
                    </p>

                </div>

            `;

        }


        // AI / DATA PATH

        function showAIPath() {

          document.getElementById("certifications").innerHTML = `

               <div class="certificate">

                 <h3>DP-900 — Azure Data Fundamentals</h3>
                 <p>Level: Beginner</p>
                 <p id="dp900Status">
                 🔵 Available
                  </p>

                 <button id="dp900Button" 
                     onclick="completeDP900()">
                     Mark as Completed
                 </button>
               </div>


             <div class="certificate">

                 <h3>AI-901 — Azure AI Fundamentals</h3>

                 <p>Level: Beginner</p>

                 <p id="ai901Status">
                 🔵 Available
                 </p>
                 <button id="ai901Button" 
                     onclick="completeAI901()">
                     Mark as Completed
                 </button>
               </div>


             <div class="certificate">

                 <h3>AI-103 — Azure AI Apps and Agents Developer</h3>

                 <p>Level: Intermediate</p>

                 <p id="ai103Status">
                 🔒 Locked
                 </p>

                </div>
            `; 
        } 
        function completeDP900() {

         document.getElementById("dp900Status").innerText =
          "🟢 Completed";
          document.getElementById("dp900Button").style.display ="none";
          checkAI103();
        

        }
        function completeAI901() {

         document.getElementById("ai901Status").innerText =
         "🟢 Completed";

            document.getElementById("ai901Button").style.display ="none";
            checkAI103();
        }
        function checkAI103() {

         const dp900Done =
         document.getElementById("dp900Status").innerText.includes("Completed");

         const ai901Done =
         document.getElementById("ai901Status").innerText.includes("Completed");


         if (dp900Done && ai901Done) {

             document.getElementById("ai103Status").innerHTML =
             "🔵 Available<br><br>" +
             '<button onclick="completeAI103()">Mark as Completed</button>';
            }   
    

        }
        function completeAI103() {

           document.getElementById("ai103Status").innerText =
          "🟢 Completed";

        }
       




        // SECURITY PATH

        function showSecurityPath() {

          document.getElementById("certifications").innerHTML = `

             <div class="certificate">
                 <h3>SC-900 — Security, Compliance and Identity Fundamentals</h3>
                 <p>Level: Beginner</p>
                 <p id="sc900Status">
                     🔵 Available
                 </p>

                 <button id="sc900Button"
                      onclick="completeSC900()">
                     Mark as Completed
                 </button>
               </div>

             <div class="certificate">
                 <h3>SC-200 — Security Operations Analyst</h3>
                 <p>Level: Intermediate</p>
                  <p id="sc200Status">
                     🔒 Locked
                  </p>
               </div>
            `;

    
        }
        function completeSC900() {

          document.getElementById("sc900Status").innerText =
         "🟢 Completed";

         document.getElementById("sc900Button").style.display =
         "none";

         document.getElementById("sc200Status").innerHTML =
         "🔵 Available<br><br>" +
         '<button onclick="completeSC200()">Mark as Completed</button>';

        }
        function completeSC200() {

           document.getElementById("sc200Status").innerText =
         "🟢 Completed";
        }


        // COMPLETE AZ-900

        function completeAZ900() {

         document.getElementById("az900Status").innerText =
         "🟢 Completed";

         document.getElementById("az900Button").style.display =
         "none";

         document.getElementById("az104Status").innerHTML =
         "🔵 Available<br><br>" +
         '<button onclick="completeAZ104()">Mark as Completed</button>';

        }


        // COMPLETE AZ-104

        function completeAZ104() {

            document.getElementById("az104Status").innerText =
                "🟢 Completed";


            document.getElementById("az305Status").innerHTML =
                "🔵 Available<br><br>" +
                '<button>Mark as Completed</button>';

        }
        function goHome() {

         document.getElementById("home").style.display = "block";

         document.getElementById("domains").style.display = "none";

         document.getElementById("path").style.display = "none";

        }

    </script>

</body>

</html>
